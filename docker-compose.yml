services:
  ollama:
    image: ollama/ollama
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: ["/bin/sh", "-c", "ollama serve & until ollama list > /dev/null 2>&1; do sleep 1; done; ollama pull llama3.2; wait"]

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      LLM_BASE_URL: http://ollama:11434/v1
    depends_on:
      - ollama

volumes:
  ollama_data: